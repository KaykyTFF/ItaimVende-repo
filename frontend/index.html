<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Itaim Vende - Plataforma de Compra, Venda e Trocas. Acesse sua conta ou cadastre-se agora.">
    <title>ItaimVende - Autenticação</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Segoe+UI&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/header-logo.png">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>    <main class="auth-wrapper auth-floating-wrapper">
        <!-- ==============================================================
             CARTÃO FLUTUANTE CENTRALIZADO (LAYOUT MODERNO DIVIDIDO)
             ============================================================== -->
        <div class="auth-floating-card" role="region" aria-label="Painel de Acesso">
            <!-- ==============================================================
                 BLOCO ESQUERDO: IDENTIDADE VISUAL COM FUNDO GEOMÉTRICO ESCURO E VERDE
                 ============================================================== -->
            <aside class="auth-brand-block" id="painel-marca" aria-label="Marca Itaim Vende">
                <div class="brand-logo-centered-box">
                    <a href="index.html" class="brand-logo-link" title="Itaim Vende - Início">
                        <img src="assets/logo-itaimvende-contorno-branco.png" alt="Itaim Vende - Compra, Venda e Trocas" class="brand-logo-center-img" id="img-logo">
                    </a>
                </div>
            </aside>

            <!-- ==============================================================
                 BLOCO DIREITO: FORMULÁRIO DE LOGIN (FUNDO BRANCO TOTAL)
                 ============================================================== -->
            <section class="auth-form-block" id="painel-principal" aria-label="Painel de Autenticação">
                <div class="auth-card-inner">
                    
                    <!-- ==========================================================
                         TELA DE LOGIN
                         ========================================================== -->
                    <div class="view-secao secao-ativa container-login" id="secao-login">
                        <h1 class="titulo-login">LOGIN</h1>

                        <form id="form-login" class="form-auth" novalidate>
                            <!-- Campo E-mail -->
                            <div class="grupo-campo">
                                <label for="input-email" class="label-campo">E-mail:</label>
                                <div class="input-wrapper">
                                    <input 
                                        type="email" 
                                        id="input-email" 
                                        name="email" 
                                        class="campo-texto" 
                                        placeholder="Digite seu e-mail" 
                                        autocomplete="email" 
                                        required
                                    >
                                </div>
                            </div>

                            <!-- Campo Senha -->
                            <div class="grupo-campo">
                                <label for="input-senha" class="label-campo">Senha:</label>
                                <div class="input-wrapper">
                                    <input 
                                        type="password" 
                                        id="input-senha" 
                                        name="senha" 
                                        class="campo-texto" 
                                        placeholder="Digite sua senha" 
                                        autocomplete="current-password" 
                                        required
                                    >
                                    <button type="button" class="btn-toggle-senha" id="btn-toggle-senha-login" aria-label="Mostrar ou ocultar senha">
                                        <svg class="icone-olho icone-aberto" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                            <circle cx="12" cy="12" r="3"></circle>
                                        </svg>
                                        <svg class="icone-olho icone-fechado icone-oculto" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                            <line x1="1" y1="1" x2="23" y2="23"></line>
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <!-- Link Esqueceu a Senha -->
                            <div class="box-esqueceu">
                                <a href="#recuperar-senha" class="link-esqueceu" id="link-esqueceu">Esqueceu a senha?</a>
                            </div>

                            <!-- Botões -->
                            <div class="box-botoes">
                                <button type="submit" class="btn-entrar" id="btn-entrar">
                                    <span class="btn-texto">ENTRAR</span>
                                    <span class="btn-spinner" aria-hidden="true"></span>
                                </button>

                                <div class="divisor-ou">
                                    <span class="linha-ou"></span>
                                    <span class="label-ou">ou</span>
                                    <span class="linha-ou"></span>
                                </div>

                                <button type="button" class="btn-cadastrar" id="btn-ir-para-cadastro">
                                    CADASTRE-SE
                                </button>
                            </div>

                            <!-- Feedback de Status -->
                            <div class="status-msg" id="status-msg-login" role="alert" aria-live="polite"></div>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- ==============================================================
         MODAL DE CADASTRO (QUADRO BRANCO CENTRALIZADO / OVERLAY COM BLUR)
         ============================================================== -->
    <div class="modal-backdrop" id="modal-cadastro" aria-hidden="true" role="dialog" aria-labelledby="modal-titulo-cadastro">
        <div class="modal-card modal-card-cadastro modal-card-white">
            <div class="bottom-sheet-handle-area" id="bottom-sheet-handle-area" title="Arraste para fechar">
                <div class="bottom-sheet-handle" id="bottom-sheet-handle" aria-hidden="true"></div>
            </div>
            <button class="modal-close" id="modal-cadastro-close-btn" aria-label="Fechar cadastro">&times;</button>
            
            <!-- Cabeçalho e Barra de Progresso do Wizard -->
            <div class="cadastro-wizard-header">
                <h2 class="titulo-login titulo-cadastro titulo-modal-cadastro" id="modal-titulo-cadastro">CADASTRO</h2>
                
                <div class="wizard-progresso-box">
                    <div class="wizard-info-linha">
                        <span class="wizard-etapa-badge" id="wizard-etapa-badge">Etapa 1 de 4</span>
                        <span class="wizard-etapa-nome" id="wizard-etapa-nome">Dados Pessoais e Localização</span>
                    </div>
                    <div class="wizard-barra-trilha">
                        <div class="wizard-barra-progresso" id="wizard-barra-progresso" style="width: 25%;"></div>
                    </div>
                </div>
            </div>

            <form id="form-cadastro-completo" class="form-auth form-wizard" novalidate>
                
                <!-- ==================================================
                     ETAPA 1: Dados Pessoais e Localização
                     ================================================== -->
                <div class="wizard-etapa-painel etapa-ativa" id="etapa-1" data-step="1">
                    <div class="grupo-campo">
                        <label for="cad-nome" class="label-campo">Nome Completo:</label>
                        <input 
                            type="text" 
                            id="cad-nome" 
                            name="nome" 
                            class="campo-texto" 
                            placeholder="Seu nome completo" 
                            required
                        >
                    </div>

                    <div class="grupo-campo">
                        <label for="cad-username" class="label-campo">Nome de Usuário (@):</label>
                        <input 
                            type="text" 
                            id="cad-username" 
                            name="username" 
                            class="campo-texto" 
                            placeholder="ex: joaosilva" 
                            required
                        >
                    </div>

                    <div class="grupo-campo">
                        <label for="cad-cidade" class="label-campo">Cidade:</label>
                        <div class="select-wrapper">
                            <select id="cad-cidade" name="cidade" class="select-campo" required>
                                <option value="" disabled selected>Selecione sua cidade</option>
                                <option value="Paulistana">Paulistana</option>
                                <option value="Acauã">Acauã</option>
                                <option value="Betânia do Piauí">Betânia do Piauí</option>
                                <option value="Curral Novo">Curral Novo</option>
                                <option value="Jacobina">Jacobina</option>
                                <option value="Queimada Nova">Queimada Nova</option>
                                <option value="Patos">Patos</option>
                                <option value="Simões">Simões</option>
                                <option value="Caridade">Caridade</option>
                                <option value="Marcolândia">Marcolândia</option>
                                <option value="Jaicós">Jaicós</option>
                                <option value="Massapê">Massapê</option>
                                <option value="Picos">Picos</option>
                                <option value="Petrolina">Petrolina</option>
                            </select>
                            <svg class="select-seta" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                    </div>

                    <div class="grupo-campo">
                        <label for="cad-bairro" class="label-campo">Bairro:</label>
                        <input 
                            type="text" 
                            id="cad-bairro" 
                            name="bairro" 
                            class="campo-texto" 
                            placeholder="Seu Bairro"
                        >
                    </div>

                    <div class="wizard-acoes-etapa">
                        <button type="button" class="btn-avancar-etapa" id="btn-avancar-etapa-1">
                            AVANÇAR &rarr;
                        </button>
                    </div>

                    <div class="box-voltar-login">
                        <button type="button" class="btn-voltar-login link-voltar" id="btn-voltar-ao-login">
                            &larr; VOLTAR
                        </button>
                    </div>
                </div>

                <!-- ==================================================
                     ETAPA 2: Contato
                     ================================================== -->
                <div class="wizard-etapa-painel" id="etapa-2" data-step="2">
                    <div class="grupo-campo">
                        <label for="cad-telefone" class="label-campo">WhatsApp / Contato:</label>
                        <input 
                            type="tel" 
                            id="cad-telefone" 
                            name="telefone" 
                            class="campo-texto" 
                            placeholder="(00) 00000-0000"
                            maxlength="15"
                            required
                        >
                    </div>

                    <div class="wizard-botoes-duplos">
                        <button type="button" class="btn-voltar-etapa" id="btn-voltar-etapa-2">
                            &larr; VOLTAR
                        </button>
                        <button type="button" class="btn-avancar-etapa" id="btn-avancar-etapa-2">
                            AVANÇAR &rarr;
                        </button>
                    </div>
                </div>

                <!-- ==================================================
                     ETAPA 3: Identificação
                     ================================================== -->
                <div class="wizard-etapa-painel" id="etapa-3" data-step="3">
                    <div class="grupo-campo">
                        <label for="cad-email-completo" class="label-campo">E-mail:</label>
                        <input 
                            type="email" 
                            id="cad-email-completo" 
                            name="email" 
                            class="campo-texto" 
                            placeholder="email@exemplo.com" 
                            required
                        >
                    </div>

                    <div class="wizard-botoes-duplos">
                        <button type="button" class="btn-voltar-etapa" id="btn-voltar-etapa-3">
                            &larr; VOLTAR
                        </button>
                        <button type="button" class="btn-avancar-etapa" id="btn-avancar-etapa-3">
                            AVANÇAR &rarr;
                        </button>
                    </div>
                </div>

                <!-- ==================================================
                     ETAPA 4: Segurança e Finalização
                     ================================================== -->
                <div class="wizard-etapa-painel" id="etapa-4" data-step="4">
                    <div class="grupo-campo">
                        <label for="cad-senha-completo" class="label-campo">Senha:</label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                id="cad-senha-completo" 
                                name="senha" 
                                class="campo-texto" 
                                placeholder="Mín 8 chars, 1 Maiúscula, 1 Símbolo" 
                                required
                            >
                            <button type="button" class="btn-toggle-senha" id="btn-toggle-cad-senha" aria-label="Mostrar ou ocultar senha">
                                <svg class="icone-olho icone-aberto" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="icone-olho icone-fechado icone-oculto" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="grupo-campo">
                        <label for="cad-confirma-senha" class="label-campo">Confirmar Senha:</label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                id="cad-confirma-senha" 
                                name="confirmaSenha" 
                                class="campo-texto" 
                                placeholder="Confirme sua senha" 
                                required
                            >
                            <button type="button" class="btn-toggle-senha" id="btn-toggle-cad-confirma" aria-label="Mostrar ou ocultar confirmação de senha">
                                <svg class="icone-olho icone-aberto" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="icone-olho icone-fechado icone-oculto" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="wizard-botoes-duplos">
                        <button type="button" class="btn-voltar-etapa" id="btn-voltar-etapa-4">
                            &larr; VOLTAR
                        </button>
                        <button type="submit" class="btn-concluir-cadastro" id="btn-concluir-cadastro">
                            <span class="btn-texto">CONCLUIR CADASTRO</span>
                            <span class="btn-spinner" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>

                <!-- Feedback de Status Cadastro -->
                <div class="status-msg" id="status-msg-cadastro" role="alert" aria-live="polite"></div>
            </form>
        </div>
    </div>

    <!-- MODAL ESQUECEU A SENHA / CONFIRMAÇÃO DE CÓDIGO -->
    <div class="modal-backdrop" id="modal-esqueceu" aria-hidden="true" role="dialog" aria-labelledby="modal-titulo-recuperar">
        <div class="modal-card">
            <button class="modal-close" id="modal-close-btn" aria-label="Fechar">&times;</button>
            <div class="modal-icon-topo" id="modal-icon-topo">
                <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#44BD32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h2 class="modal-titulo" id="modal-titulo-recuperar">Recuperar Senha</h2>
            <p class="modal-descricao" id="modal-descricao-recuperar">Informe o e-mail cadastrado na sua conta para enviarmos as instruções de recuperação de senha.</p>
            
            <!-- FORMULÁRIO DE RECUPERAÇÃO -->
            <form id="form-recuperar-etapa1" class="form-auth" novalidate>
                <div class="grupo-campo">
                    <label for="recuperar-email" class="label-campo">E-mail cadastrado:</label>
                    <input type="email" id="recuperar-email" class="campo-texto" placeholder="exemplo@email.com" required>
                </div>
                <button type="submit" class="btn-entrar btn-modal" id="btn-enviar-recuperacao">
                    <span class="btn-texto">ENVIAR INSTRUÇÕES</span>
                    <span class="btn-spinner" aria-hidden="true"></span>
                </button>
                <div class="status-msg" id="status-modal-recuperar"></div>
            </form>
        </div>
    </div>

    <!-- Script JS -->
    <script src="js/core/rotas.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/core/sessao.js"></script>
    <script src="js/pages/auth/app.js"></script>
</body>
</html>
