<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <!-- Redirecionamento Automático para a Tela Oficial Unificada de Cadastro -->
    <script>
        (function() {
            var search = window.location.search || '';
            var hash = window.location.hash || '#cadastro';
            if (!hash.includes('cadastro')) hash = '#cadastro';
            window.location.replace('../../index.html' + search + hash);
        })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Itaim Vende - Cadastro de Novo Usuário.">
    <title>Novo Cadastro - ItaimVende</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Segoe+UI&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../../assets/logos/header-logo.png">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../../css/core/style.css">
    <!-- Google Identity Services -->
        <!-- Capturador Instantâneo de Retorno do Google OAuth na Mini Janela -->
    <script>
        (function() {
            try {
                var hash = window.location.hash;
                if (hash && hash.indexOf('access_token=') !== -1) {
                    var isPopup = (window.name === 'ItaimGoogleAuthWindow') ||
                                  (hash.indexOf('state=itaim_popup') !== -1) ||
                                  (window.opener && window.opener !== window) ||
                                  (window.innerWidth < 650 && window.innerHeight < 750);

                    if (isPopup) {
                        var params = new URLSearchParams(hash.substring(1));
                        var token = params.get('access_token');
                        if (token) {
                            try {
                                localStorage.setItem('itaim_google_oauth_token', token);
                                localStorage.setItem('itaim_google_oauth_timestamp', Date.now().toString());
                            } catch (e) {}

                            try {
                                var channel = new BroadcastChannel('itaim_google_auth_channel');
                                channel.postMessage({ type: 'GOOGLE_AUTH_TOKEN', accessToken: token });
                                channel.close();
                            } catch (e) {}

                            if (window.opener) {
                                try {
                                    window.opener.postMessage({ type: 'GOOGLE_AUTH_TOKEN', accessToken: token }, '*');
                                } catch (e) {}
                            }

                            document.documentElement.innerHTML = '<head><title>Autenticado</title></head><body style="background:#fff;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#489636;margin:0;"><h3>Autenticado com sucesso! Fechando janela...</h3></body>';
                            window.close();
                            setTimeout(function() { window.close(); }, 100);
                            setTimeout(function() { window.close(); }, 300);
                            throw new Error('OAuth Popup Terminated');
                        }
                    }
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <main class="auth-wrapper">
        <!-- ÁREA SUPERIOR (LOGO E MASCOTE) -->
        <header class="topo-container topo-compacto">
            <div class="logo-box">
                <a href="/login" title="Ir para o início">
                    <img src="../../assets/logos/header-logo.png" alt="Itaim Vende - Compra, Venda e Trocas" class="logo-img">
                </a>
            </div>
        </header>

        <!-- ÁREA INFERIOR (PAINEL ESCURO COM LINHA VERDE RETINHA COMO NO DESKTOP) -->
        <section class="painel-inferior painel-reto" aria-label="Painel de Cadastro">
            <div class="container-cadastro">
                                <!-- Opção de Cadastro Rápido com Google -->
                <button type="button" class="btn-cadastro-google" id="btn-cadastro-google">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                    </svg>
                    <span>Cadastrar-se com o Google</span>
                </button>
                <div class="divisor-social">
                    <span>ou preencha com seus dados</span>
                </div>
<form id="form-cadastro-direto" class="form-auth" novalidate>
                    
                    <!-- Campo Nome Completo -->
                    <div class="grupo-campo">
                        <label for="cad-nome" class="label-campo">Nome Completo:</label>
                        <input 
                            type="text" 
                            id="cad-nome" 
                            name="nome" 
                            class="campo-texto" 
                            placeholder="Seu nome completo" 
                            required
                        >
                    </div>

                    <!-- Campo Nome de Usuário (@) posicionado logo abaixo do Nome Completo -->
                    <div class="grupo-campo">
                        <label for="cad-username" class="label-campo">Nome de Usuário (@):</label>
                        <input 
                            type="text" 
                            id="cad-username" 
                            name="username" 
                            class="campo-texto" 
                            placeholder="ex: joaosilva" 
                            required
                        >
                    </div>

                    <!-- Campo CEP e Estado -->
                    <div class="linha-dupla-campos">
                        <div class="grupo-campo campo-flex-2">
                            <label for="cad-cep" class="label-campo">CEP:</label>
                            <input 
                                type="text" 
                                id="cad-cep" 
                                name="cep" 
                                class="campo-texto" 
                                placeholder="00000-000"
                                maxlength="9"
                            >
                        </div>
                        <div class="grupo-campo campo-flex-1">
                            <label for="cad-estado" class="label-campo">Estado:</label>
                            <input 
                                type="text" 
                                id="cad-estado" 
                                name="estado" 
                                class="campo-texto" 
                                placeholder="ex: PI" 
                                maxlength="2"

                            >
                        </div>
                    </div>

                    <!-- Campo Cidade -->
                    <div class="grupo-campo">
                        <label for="cad-cidade" class="label-campo">Cidade:</label>
                        <div class="select-wrapper">
                            <select id="cad-cidade" name="cidade" class="select-campo" required>
                                <option value="" disabled selected>Selecione sua cidade</option>
                                <option value="Paulistana">Paulistana</option>
                                <option value="Acauã">Acauã</option>
                                <option value="Betânia do Piauí">Betânia do Piauí</option>
                                <option value="Curral Novo">Curral Novo</option>
                                <option value="Jacobina">Jacobina</option>
                                <option value="Queimada Nova">Queimada Nova</option>
                                <option value="Patos">Patos</option>
                                <option value="Simões">Simões</option>
                                <option value="Caridade">Caridade</option>
                                <option value="Marcolândia">Marcolândia</option>
                                <option value="Jaicós">Jaicós</option>
                                <option value="Massapê">Massapê</option>
                                <option value="Picos">Picos</option>
                                <option value="Petrolina">Petrolina</option>
                            </select>
                            <svg class="select-seta" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                    </div>

                    <!-- Campo Bairro -->
                    <div class="grupo-campo">
                        <label for="cad-bairro" class="label-campo">Bairro:</label>
                        <input 
                            type="text" 
                            id="cad-bairro" 
                            name="bairro" 
                            class="campo-texto" 
                            placeholder="Seu Bairro"
                        >
                    </div>

                    <!-- Campo WhatsApp / Contato -->
                    <div class="grupo-campo">
                        <label for="cad-telefone" class="label-campo">WhatsApp / Contato:</label>
                        <input 
                            type="tel" 
                            id="cad-telefone" 
                            name="telefone" 
                            class="campo-texto" 
                            placeholder="(00) 00000-0000"
                            maxlength="15"
                        >
                    </div>

                    <div class="grupo-campo">
                        <label for="cad-email" class="label-campo">E-mail:</label>
                        <input 
                            type="email" 
                            id="cad-email" 
                            name="email" 
                            class="campo-texto" 
                            placeholder="email@exemplo.com" 
                            required
                        >
                    </div>

                    <div class="grupo-campo">
                        <label for="cad-senha" class="label-campo">Senha:</label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                id="cad-senha" 
                                name="senha" 
                                class="campo-texto" 
                                placeholder="Mín 8 chars, 1 Maiúscula, 1 Símbolo" 
                                required
                            >
                            <button type="button" class="btn-toggle-senha" id="btn-toggle-cad-senha" aria-label="Mostrar ou ocultar senha">
                                <svg class="icone-olho icone-aberto icone-oculto" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="icone-olho icone-fechado" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="grupo-campo">
                        <label for="cad-confirma" class="label-campo">Confirmar Senha:</label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                id="cad-confirma" 
                                name="confirma" 
                                class="campo-texto" 
                                placeholder="Confirme sua senha" 
                                required
                            >
                            <button type="button" class="btn-toggle-senha" id="btn-toggle-cad-confirma" aria-label="Mostrar ou ocultar confirmação de senha">
                                <svg class="icone-olho icone-aberto icone-oculto" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="icone-olho icone-fechado" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="aviso-privacidade-cadastro" style="font-size: 0.8rem; color: #64748b; line-height: 1.45; margin-bottom: 1.25rem; padding: 0.75rem; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;">
                        Ao criar sua conta, você concorda com os nossos <a href="/termos" target="_blank" style="color: #2563eb; text-decoration: underline;">Termos de Uso</a> e autoriza o tratamento dos seus dados cadastrais conforme a nossa <a href="/politica-de-privacidade" target="_blank" style="color: #2563eb; text-decoration: underline;">Política de Privacidade</a> (LGPD).
                    </div>

                    <!-- Botões Lado a Lado (VOLTAR vazado e CONCLUIR CADASTRO preenchido) -->
                    <div class="wizard-botoes-duplos">
                        <a href="/login" class="btn-voltar-etapa btn-voltar-auth" id="btn-voltar-login-link" style="text-decoration: none;">
                            VOLTAR
                        </a>
                        <button type="submit" class="btn-concluir-cadastro" id="btn-concluir-cadastro">
                            <span class="btn-texto">CONCLUIR CADASTRO</span>
                            <span class="btn-spinner" aria-hidden="true"></span>
                        </button>
                    </div>

                    <!-- Feedback de Status -->
                    <div class="status-msg" id="status-msg-cadastro" role="alert" aria-live="polite"></div>
                </form>

                <footer class="auth-rodape-institucional" style="margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid rgba(255, 255, 255, 0.08); text-align: center; font-size: 0.75rem; color: #94a3b8; display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap;">
                    <a href="/termos" style="color: inherit; text-decoration: underline;">Termos de Uso</a>
                    <span>&bull;</span>
                    <a href="/politica-de-privacidade" style="color: inherit; text-decoration: underline;">Política de Privacidade</a>
                    <span>&bull;</span>
                    <a href="/politica-de-cookies" style="color: inherit; text-decoration: underline;">Política de Cookies</a>
                    <span>&bull;</span>
                    <a href="#" data-acao="abrir-cookies" style="color: inherit; text-decoration: underline;">Preferências de Cookies</a>
                </footer>
            </div>
        </section>
    </main>

    <!-- Script JS -->
    <script src="../../js/core/rotas/index.js"></script>
    <script src="../../js/core/api/index.js"></script>
    <script src="../../js/core/sessao/index.js"></script>
    <script src="../../js/pages/auth/auth-senha-toggle.js"></script>
    <script src="../../js/pages/auth/app.js?v=2.0"></script>
</body>
</html>
